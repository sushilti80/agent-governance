name: Governance Release Guard

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: aya-devops-rs
    steps:
      - name: Checkout tagged policy
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-governance.txt

      - name: Install governance dependencies
        run: python -m pip install -r requirements-governance.txt

      - name: Validate governance repository
        run: python scripts/governance_check.py --policy-root . --target-root .

      - name: Validate release tag
        run: python scripts/release_check.py --root . --tag "$GITHUB_REF_NAME"

      - name: Run regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'
