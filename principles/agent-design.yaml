spec_version: 1
principles:
  AGP-001:
    name: outcome_first
    severity: required
    description: Define the required outcome and observable success criteria instead of prescribing obvious reasoning steps.
  AGP-002:
    name: instruction_once
    severity: required
    description: A behavioral instruction has one authoritative home. Avoid duplicate, competing, or independently redefined rules across repository policy, agents, and skills unless deliberate reinforcement is justified by evidence.
  AGP-003:
    name: repository_is_truth
    severity: required
    description: Current repository evidence overrides assumptions, examples, memory, and stale learned context when making factual decisions about the repository.
  AGP-004:
    name: minimum_necessary_instruction
    severity: required
    description: Do not add or retain a persistent prompt instruction without evidence that it prevents a demonstrated failure or encodes an organizational invariant; prompt accumulation is a design defect.
  AGP-005:
    name: bounded_autonomy
    severity: required
    description: Inspection, mutation, external-action, and approval authority must be explicit, bounded, and no broader than required by the task. Missing or ambiguous authority is not permission.
  AGP-006:
    name: deterministic_before_agentic
    severity: required
    description: Prefer deterministic code, tools, and CI for deterministic operations such as formatting, parsing, validation, comparison, and bounded enumeration instead of repeated model reasoning.
  AGP-007:
    name: validate_after_mutation
    severity: required
    description: Mutations require relevant deterministic validation before the agent may claim success.
  AGP-008:
    name: bounded_delegation
    severity: required
    description: Delegate only genuinely independent workstreams, prevent recursive or unbounded fan-out, retain synthesis and completion responsibility in the primary agent, and never use delegation to amplify authority.
  AGP-009:
    name: learning_propose_only
    severity: required
    description: Runtime learning may propose changes but may not directly alter or promote governing instructions, policies, agents, or skills.
  AGP-010:
    name: evidence_before_learning
    severity: required
    description: Learning must be linked to observed evidence and a reproducible evaluation or explicit organizational invariant before behavioral promotion.
  AGP-011:
    name: smallest_correct_layer
    severity: required
    description: "Fix failures in the narrowest layer that owns them: deterministic mechanism, skill, repository policy, agent, then global governance."
  AGP-012:
    name: measurable_evolution
    severity: required
    description: Agent changes must improve or preserve behavior under representative correctness, safety, scope, validation, and efficiency evaluations.
  AGP-013:
    name: coherent_behavioral_contract
    severity: required
    description: Applicable instructions must form one mutually satisfiable behavioral contract. Contradictions in goals, authority, scope, validation, approval, delegation, or stopping behavior are governance defects and must not be resolved by choosing the more permissive interpretation.
  AGP-014:
    name: authority_non_expansion
    severity: required
    description: Effective authority is the intersection of organization governance, repository policy, agent authority, requested task scope, and required approvals. Lower layers may narrow authority but must never broaden it; uncertainty never creates authority.
  AGP-015:
    name: role_separation
    severity: required
    description: Repository instructions own repository-wide invariants; agents own intent, authority, scope, success, and escalation; skills own reusable procedure and validation; deterministic code and tools own deterministic mechanics; delegated agents own bounded subtasks.
  AGP-016:
    name: stop_or_escalate
    severity: required
    description: Stop when success criteria and required validation are satisfied. When blocked by missing evidence, authority, approval, or an unresolved contradiction, escalate instead of guessing, widening scope, repeatedly searching, or delegating without progress.
